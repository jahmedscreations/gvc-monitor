name: GVC Appointment Monitor

on:
  schedule:
    # Every 15 minutes. GitHub may delay runs during peak load.
    - cron: "*/15 * * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to commit the state file back to the repo

concurrency:
  group: gvc-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          # Remove the obsolete state file from the old version, if present.
          git rm --quiet --ignore-unmatch last_seen.txt || true

          # Stage the current state file (works whether new or modified).
          git add -A seen_articles.json

          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update seen articles state"
            git push
            echo "State committed."
          fi
